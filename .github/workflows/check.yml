name: Check

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
          - runner: windows-latest
            arch: x86_64
          - runner: windows-11-arm
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: check-${{ matrix.runner }}

      - if: matrix.runner == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - run: cargo check --workspace

      - run: cargo build --workspace --bins

      - run: cargo clippy --workspace --all-targets --all-features

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
          - runner: windows-latest
            arch: x86_64
          - runner: windows-11-arm
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.runner }}

      - run: cargo test --workspace

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e

      - run: cargo test -p sculk --features e2e --test e2e
