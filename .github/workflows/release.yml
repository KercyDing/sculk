name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
            suffix: linux-amd64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            suffix: linux-arm64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            suffix: darwin-amd64
          - target: aarch64-apple-darwin
            runner: macos-15
            suffix: darwin-arm64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            suffix: windows-amd64
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            suffix: windows-arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl-tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --workspace --bins --release --target ${{ matrix.target }}

      - name: Rename artifacts (unix)
        if: runner.os != 'Windows'
        run: |
          mv target/${{ matrix.target }}/release/sculk sculk-${{ matrix.suffix }}

      - name: Rename artifacts (windows)
        if: runner.os == 'Windows'
        run: |
          mv target/${{ matrix.target }}/release/sculk.exe sculk-${{ matrix.suffix }}.exe

      - name: Upload artifacts (unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-bins
          path: sculk-${{ matrix.suffix }}

      - name: Upload artifacts (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-bins
          path: sculk-${{ matrix.suffix }}.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: sculk-*
          generate_release_notes: true

  aur:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - pkg: sculk-bin
            dir: packaging/arch/sculk-bin
          - pkg: sculk-git
            dir: packaging/arch/sculk-git
    steps:
      - uses: actions/checkout@v4

      - name: Update pkgver in PKGBUILD
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKGVER="${VERSION//-/_}"
          sed -i "s/^pkgver=.*/pkgver=${PKGVER}/" ${{ matrix.dir }}/PKGBUILD

      - name: Update sha256sums for -bin packages
        if: contains(matrix.pkg, '-bin')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET_URL="https://github.com/KercyDing/sculk/releases/download/v${VERSION}/sculk-linux-amd64"
          SHA=$(curl -sL "$ASSET_URL" | sha256sum | cut -d' ' -f1)
          sed -i "s/^sha256sums=.*/sha256sums=('${SHA}')/" ${{ matrix.dir }}/PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: ${{ matrix.pkg }}
          pkgbuild: ${{ matrix.dir }}/PKGBUILD
          commit_username: KercyDing
          commit_email: dkx215417@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
