[workspace]
members = ["core", "cli"]
resolver = "3"

[workspace.package]
authors = ["KercyDing"]
edition = "2024"
repository = "https://github.com/KercyDing/sculk"
rust-version = "1.91"
version = "0.6.0"

[workspace.dependencies]
sculk = { path = "core", version = "0.6.0" }
anyhow = "1.0"
futures-util = "0.3"
iroh = { version = "1", default-features = false, features = ["portmapper", "tls-ring"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive"] }
arboard = { version = "3.6", default-features = false }
dirs = "6"
rand = "0.10"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
toml = "1"
url = "2.5"
subtle = "2"
thiserror = "2"
socket2 = "0.6"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
