name: sculk-nat

x-common: &common
  image: sculk-nat-test
  build:
    context: ../..
    dockerfile: docker/nat/Dockerfile
  init: true
  volumes:
    - ./bin/iroh-relay:/usr/local/bin/iroh-relay:ro
    - ./certs:/certs:ro
    - ./relay.toml:/etc/iroh-relay.toml:ro
    - ./scripts:/scripts:ro
    - ./run:/shared
  restart: "no"

services:
  relay:
    <<: *common
    command: ["iroh-relay", "--config-path", "/etc/iroh-relay.toml"]
    networks:
      wan:
        ipv4_address: 172.30.0.10

  nat-a:
    <<: *common
    command: ["/scripts/nat.sh", "172.30.1.0/24", "172.30.0.3", "172.30.1.254", "172.30.0.2"]
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      BLOCK_DIRECT: ${BLOCK_DIRECT:-1}
    networks:
      lan_a:
        ipv4_address: 172.30.1.254
      wan:
        ipv4_address: 172.30.0.2

  nat-b:
    <<: *common
    command: ["/scripts/nat.sh", "172.30.2.0/24", "172.30.0.2", "172.30.2.254", "172.30.0.3"]
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      BLOCK_DIRECT: ${BLOCK_DIRECT:-1}
    networks:
      lan_b:
        ipv4_address: 172.30.2.254
      wan:
        ipv4_address: 172.30.0.3

  host:
    <<: *common
    command: ["/scripts/host.sh"]
    cap_add: [NET_ADMIN]
    environment:
      RELAY_URL: https://172.30.0.10:3340/
    networks:
      lan_a:
        ipv4_address: 172.30.1.10
    depends_on: [relay, nat-a]

  join:
    <<: *common
    command: ["/scripts/join.sh"]
    cap_add: [NET_ADMIN]
    environment:
      EXPECTED_PATH: ${EXPECTED_PATH:-relay}
    networks:
      lan_b:
        ipv4_address: 172.30.2.10
    depends_on: [relay, nat-b, host]

networks:
  wan:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  lan_a:
    ipam:
      config:
        - subnet: 172.30.1.0/24
  lan_b:
    ipam:
      config:
        - subnet: 172.30.2.0/24
